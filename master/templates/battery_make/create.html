{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block breadcrumb_active %}{{ title }}{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 500px; margin: 0 auto; background:#fff; padding:30px; border-radius:16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="font-size:1.4rem; font-weight:800; color:#1e293b; margin-bottom:20px;">{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:18px;">
            <div>
                <label style="font-weight:700; font-size:0.9rem; color:#334155; margin-bottom:6px; display:block;">Make / Brand Name *</label>
                {{ form.name }}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                {{ form.is_active }}
                <label for="{{ form.is_active.id_for_label }}" style="font-weight:600; color:#334155; cursor:pointer;">Active</label>
            </div>
        </div>
        <div style="display:flex; gap:12px; margin-top:30px; justify-content:flex-end;">
            <a href="{% url 'battery_make_list' %}" style="padding:10px 20px; border-radius:8px; text-decoration:none; color:#64748b; background:#f1f5f9; font-weight:600;">Cancel</a>
            <button type="submit" style="padding:10px 24px; border-radius:8px; background:#000080; color:#fff; border:none; font-weight:700; cursor:pointer;">Save</button>
        </div>
    </form>
</div>
{% endblock %}
