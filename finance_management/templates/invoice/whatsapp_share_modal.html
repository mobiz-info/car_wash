<!-- Reusable WhatsApp PDF Share Modal -->
<style>
    .wa-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10001;
        padding: 16px;
    }

    .wa-modal-card {
        background: #ffffff;
        border-radius: 20px;
        max-width: 520px;
        width: 100%;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid #e2e8f0;
        animation: waModalFadeIn 0.2s ease-out;
    }

    @keyframes waModalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.96) translateY(8px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    .wa-modal-header {
        padding: 18px 24px;
        background: linear-gradient(135deg, #065f46, #059669, #10b981);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .wa-modal-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.15rem;
        font-weight: 700;
    }

    .wa-modal-close {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: 0.2s;
    }

    .wa-modal-close:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    .wa-modal-body {
        padding: 22px;
    }

    .wa-info-box {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 18px;
    }

    .wa-btn-card {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1.5px solid #e2e8f0;
        background: #ffffff;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
        margin-bottom: 12px;
        text-decoration: none;
        color: inherit;
    }

    .wa-btn-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .wa-btn-card.primary {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border-color: #059669;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.28);
    }

    .wa-btn-card.primary:hover {
        background: linear-gradient(135deg, #059669, #047857);
    }

    .wa-btn-card.secondary {
        background: #f0fdf4;
        border-color: #86efac;
        color: #14532d;
    }

    .wa-btn-card.secondary:hover {
        background: #dcfce7;
    }

    .wa-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        flex-shrink: 0;
    }

    .wa-status-alert {
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 16px;
        display: none;
        align-items: center;
        gap: 10px;
    }
</style>

<div id="waShareModalOverlay" class="wa-modal-overlay">
    <div class="wa-modal-card">
        <!-- Header -->
        <div class="wa-modal-header">
            <div class="wa-modal-title">
                <i class="ph-bold ph-whatsapp-logo" style="font-size: 1.45rem;"></i>
                <span>Share Invoice PDF to WhatsApp</span>
            </div>
            <button type="button" class="wa-modal-close" onclick="closeWhatsAppShareModal()">&times;</button>
        </div>

        <!-- Body -->
        <div class="wa-modal-body">
            <!-- Details Box -->
            <div class="wa-info-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span style="font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase;">Invoice</span>
                    <span id="waModalInvNumber" style="font-family: monospace; font-weight: 800; font-size: 1rem; color: #000080;"></span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="waModalCustomer" style="font-weight: 700; color: #1e293b; font-size: 0.95rem;"></span>
                    <span id="waModalPhone" style="font-weight: 600; color: #059669; font-size: 0.9rem;"></span>
                </div>
            </div>

            <!-- Status Alert -->
            <div id="waModalStatusAlert" class="wa-status-alert"></div>

            <!-- Option 1: WhatsApp API (Only for WhatsApp API Enabled Users) -->
            <div id="waOptionApiWrapper" {% if not request.user.profile.company.whatsapp_setting.is_official_api or not request.user.profile.company.whatsapp_setting.username or not request.user.profile.company.whatsapp_setting.password %}style="display:none;"{% endif %}>
                <button type="button" id="btnWaSendApi" class="wa-btn-card primary" onclick="sendInvoicePdfViaApi()">
                    <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                        <i class="ph-bold ph-paper-plane-tilt"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; font-size: 1.05rem;">1. WhatsApp API</div>
                        <div style="font-size: 0.82rem; opacity: 0.95; margin-top: 3px;">
                            Instantly sends the official Invoice PDF document directly to customer's WhatsApp
                        </div>
                    </div>
                </button>
            </div>

            <!-- Option 2: Share PDF File (Opens Customer WhatsApp with PDF to Send) -->
            <button type="button" id="btnWaShareFile" class="wa-btn-card secondary" onclick="shareInvoicePdfFile()">
                <div class="wa-icon-box" style="background: #25d366; color: white;">
                    <i class="ph-bold ph-whatsapp-logo"></i>
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 1.05rem; color: #065f46;">2. Share PDF File</div>
                    <div style="font-size: 0.82rem; color: #166534; margin-top: 3px;">
                        Opens customer's WhatsApp with the invoice PDF ready to send
                    </div>
                </div>
            </button>
        </div>
    </div>
</div>

<script>
    const USER_HAS_WHATSAPP_API = {% if request.user.profile.company.whatsapp_setting.is_official_api and request.user.profile.company.whatsapp_setting.username and request.user.profile.company.whatsapp_setting.password %}true{% else %}false{% endif %};

    let currentWaInvoiceId = null;
    let currentWaInvoiceNumber = '';
    let currentWaCustomerName = '';
    let currentWaPhone = '';

    function openWhatsAppShareModal(invoiceId, invoiceNumber, customerName, phone) {
        currentWaInvoiceId = invoiceId;
        currentWaInvoiceNumber = invoiceNumber || '';
        currentWaCustomerName = customerName || 'Customer';
        currentWaPhone = phone || '';

        // If user does not have WhatsApp API enabled, we can directly execute option 2 or show the modal
        const apiWrapper = document.getElementById('waOptionApiWrapper');
        if (apiWrapper) {
            apiWrapper.style.display = USER_HAS_WHATSAPP_API ? 'block' : 'none';
        }

        document.getElementById('waModalInvNumber').innerText = currentWaInvoiceNumber;
        document.getElementById('waModalCustomer').innerText = currentWaCustomerName;
        document.getElementById('waModalPhone').innerText = currentWaPhone ? `+${currentWaPhone.replace(/^\+/, '')}` : 'No phone';

        const alertBox = document.getElementById('waModalStatusAlert');
        alertBox.style.display = 'none';

        const btnApi = document.getElementById('btnWaSendApi');
        if (btnApi) {
            btnApi.disabled = false;
            btnApi.innerHTML = `
                <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                    <i class="ph-bold ph-paper-plane-tilt"></i>
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 1.05rem;">1. WhatsApp API</div>
                    <div style="font-size: 0.82rem; opacity: 0.95; margin-top: 3px;">
                        Instantly sends the official Invoice PDF document directly to customer's WhatsApp
                    </div>
                </div>
            `;
        }

        // If non-API user, user can also choose to open directly
        if (!USER_HAS_WHATSAPP_API) {
            // For non-API users, open customer WhatsApp with PDF send immediately
            shareInvoicePdfFile();
            return;
        }

        document.getElementById('waShareModalOverlay').style.display = 'flex';
    }

    function closeWhatsAppShareModal() {
        document.getElementById('waShareModalOverlay').style.display = 'none';
    }

    // Close on backdrop click
    document.getElementById('waShareModalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeWhatsAppShareModal();
    });

    // 1. Send PDF via WhatsApp Business API
    function sendInvoicePdfViaApi() {
        if (!currentWaInvoiceId) return;

        const btn = document.getElementById('btnWaSendApi');
        const alertBox = document.getElementById('waModalStatusAlert');

        btn.disabled = true;
        btn.innerHTML = `
            <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                <i class="ph ph-spinner-gap" style="animation: spin 1s linear infinite;"></i>
            </div>
            <div style="flex: 1;">
                <div style="font-weight: 700; font-size: 1rem;">Sending PDF via WhatsApp API...</div>
                <div style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">Delivering document to customer...</div>
            </div>
        `;

        const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value 
            || (document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1]) 
            || '';

        fetch('/api/invoice/send-whatsapp/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrf
            },
            body: JSON.stringify({ invoice_id: currentWaInvoiceId })
        })
        .then(res => res.json())
        .then(data => {
            btn.disabled = false;
            if (data.success && data.has_api !== false) {
                btn.innerHTML = `
                    <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                        <i class="ph-bold ph-check"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; font-size: 1rem;">Sent Successfully!</div>
                        <div style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">PDF delivered to customer's WhatsApp</div>
                    </div>
                `;
                alertBox.className = 'wa-status-alert';
                alertBox.style.cssText = 'display:flex; background:#dcfce7; color:#14532d; border:1px solid #86efac;';
                alertBox.innerHTML = `<i class="ph-bold ph-check-circle" style="font-size:1.3rem;"></i> <div><strong>Success!</strong> Invoice PDF has been sent directly to customer WhatsApp via API.</div>`;
                setTimeout(() => {
                    closeWhatsAppShareModal();
                }, 2000);
            } else {
                btn.innerHTML = `
                    <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                        <i class="ph-bold ph-paper-plane-tilt"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; font-size: 1rem;">Retry Send via API</div>
                        <div style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">${data.message || 'API not configured'}</div>
                    </div>
                `;
                alertBox.style.cssText = 'display:flex; background:#fef2f2; color:#991b1b; border:1px solid #fecaca;';
                alertBox.innerHTML = `<i class="ph-bold ph-warning-circle" style="font-size:1.3rem;"></i> <div>${data.message || 'Failed to send via WhatsApp API. Use Share PDF File below.'}</div>`;
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = `
                <div class="wa-icon-box" style="background: rgba(255,255,255,0.2);">
                    <i class="ph-bold ph-arrow-clockwise"></i>
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 1rem;">Retry API Send</div>
                </div>
            `;
            alertBox.style.cssText = 'display:flex; background:#fef2f2; color:#991b1b; border:1px solid #fecaca;';
            alertBox.innerHTML = `<i class="ph-bold ph-warning-circle" style="font-size:1.3rem;"></i> <div>Network error. Use Share PDF File below.</div>`;
        });
    }

    // 2. Share PDF File (Opens Customer's WhatsApp with PDF to Send)
    async function shareInvoicePdfFile() {
        if (!currentWaInvoiceId) return;

        const alertBox = document.getElementById('waModalStatusAlert');
        const pdfUrl = `/invoices/${currentWaInvoiceId}/pdf/`;
        const cleanPhone = (currentWaPhone || '').replace(/\D/g, '');

        if (alertBox) {
            alertBox.style.cssText = 'display:flex; background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe;';
            alertBox.innerHTML = `<i class="ph ph-spinner-gap" style="animation: spin 1s linear infinite; font-size:1.3rem;"></i> <div>Preparing PDF and opening WhatsApp...</div>`;
        }

        try {
            const resp = await fetch(pdfUrl);
            const blob = await resp.blob();
            const fileName = `Invoice-${currentWaInvoiceNumber || 'INV'}.pdf`;
            const file = new File([blob], fileName, { type: 'application/pdf' });

            // On devices supporting Web Share API with files (Mobile devices, iPads, Mac Safari):
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: `Invoice ${currentWaInvoiceNumber}`,
                    text: `Invoice #${currentWaInvoiceNumber}`
                });
                if (alertBox) {
                    alertBox.style.cssText = 'display:flex; background:#dcfce7; color:#14532d; border:1px solid #86efac;';
                    alertBox.innerHTML = `<i class="ph-bold ph-check-circle" style="font-size:1.3rem;"></i> <div>WhatsApp opened with PDF document!</div>`;
                }
                closeWhatsAppShareModal();
                return;
            }

            // On Desktop browsers: download PDF file and open that specific customer's WhatsApp chat
            downloadFileBlob(blob, fileName);

            const waChatUrl = cleanPhone 
                ? `https://web.whatsapp.com/send?phone=${cleanPhone}` 
                : `https://web.whatsapp.com/`;
            
            window.open(waChatUrl, '_blank');

            if (alertBox) {
                alertBox.style.cssText = 'display:flex; background:#dcfce7; color:#14532d; border:1px solid #86efac;';
                alertBox.innerHTML = `<i class="ph-bold ph-check-circle" style="font-size:1.3rem;"></i> <div><strong>PDF Ready!</strong> Downloaded <strong>${fileName}</strong> and opened customer's WhatsApp. Drop or attach the file to send.</div>`;
            }

        } catch (err) {
            if (err.name !== 'AbortError') {
                if (alertBox) {
                    alertBox.style.cssText = 'display:flex; background:#fef2f2; color:#991b1b; border:1px solid #fecaca;';
                    alertBox.innerHTML = `<i class="ph-bold ph-warning-circle" style="font-size:1.3rem;"></i> <div>${err.message || 'Error sharing file.'}</div>`;
                }
            }
        }
    }

    function downloadFileBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
</script>
